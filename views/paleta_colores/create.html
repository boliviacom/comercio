<div class="bg-white dark:bg-[#1a222c] w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
    <div class="p-6 border-b border-gray-100 dark:border-[#2a3441] flex justify-between items-center bg-gray-50/50 dark:bg-[#111418]/50">
        <h3 class="text-xl font-extrabold text-[#111418] dark:text-white">Nueva Paleta de Colores</h3>
        <button onclick="window.cerrarModalPaleta()" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>
    
    <form id="formNuevaPaleta" class="p-8">
        <div class="mb-8">
            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Nombre de la paleta</label>
            <input type="text" name="nombre" required placeholder="Ej. Diseño Corporativo" 
                class="w-full bg-gray-100 dark:bg-[#111418] border-none rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Color Primario</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_primary" value="#3b82f6" maxlength="7" 
                        class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_primary" value="#3b82f6" 
                        class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Color Secundario</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_secondary" value="#6366f1" maxlength="7" class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_secondary" value="#6366f1" class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Color de Acento</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_accent" value="#f59e0b" maxlength="7" class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_accent" value="#f59e0b" class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Color de Fondo</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_bg" value="#ffffff" maxlength="7" class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_bg" value="#ffffff" class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Superficie</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_surface" value="#f3f4f6" maxlength="7" class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_surface" value="#f3f4f6" class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Color de Texto</label>
                <div class="flex items-center gap-3 bg-gray-50 dark:bg-[#111418] p-2 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <input type="text" name="color_text" value="#111827" maxlength="7" class="hex-input w-full bg-transparent border-none text-sm font-mono focus:ring-0 uppercase">
                    <input type="color" data-for="color_text" value="#111827" class="color-picker w-12 h-10 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>
        </div>

        <div class="mt-10 flex gap-4">
            <button type="button" onclick="window.cerrarModalPaleta()" class="flex-1 py-4 text-sm font-bold text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-2xl transition-all">Cancelar</button>
            <button type="submit" class="flex-[2] py-4 text-sm font-bold bg-primary text-white rounded-2xl hover:shadow-lg transition-all">Guardar Paleta</button>
        </div>
    </form>
</div>
