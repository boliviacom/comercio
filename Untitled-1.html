<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Pro + Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #3ecf8e;
            --bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #camera-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/4;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-snap {
            background: white;
            color: black;
        }

        .btn-record {
            background: #ef4444;
            color: white;
        }

        .btn-switch {
            background: #64748b;
            color: white;
            grid-column: span 2;
        }

        #uploadSection {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: none;
            padding: 20px;
        }

        .btn-upload {
            background: var(--primary);
            color: var(--bg);
            width: 100%;
            font-size: 1.1rem;
        }

        #status {
            color: #94a3b8;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="camera-container">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button id="btnSnap" class="btn-snap">📷 TOMAR FOTO</button>
        <button id="btnRecord" class="btn-record">🎥 GRABAR VIDEO</button>
        <button id="btnSwitch" class="btn-switch">🔄 CAMBIAR CÁMARA</button>
    </div>

    <div id="uploadSection">
        <p id="infoPreview">Multimedia lista</p>
        <button id="btnUpload" class="btn-upload" disabled>ESPERANDO COMPRESOR...</button>
    </div>

    <p id="status">Iniciando sistemas...</p>

    <script>
        const CONF = {
            URL: 'https://bhbbjvcoujxzqaqjqnti.supabase.co',
            KEY: 'sb_publishable_C_OFBl6KdorQVKjnHFBUyg_DamW_LmK',
            BUCKET: 'Almacenamiento'
        };

        const supabaseClient = supabase.createClient(CONF.URL, CONF.KEY);

        let currentStream = null;
        let mediaRecorder = null;
        let chunks = [];
        let capturedBlob = null;
        let ffmpeg = null;
        let useFrontCamera = false;
        let isFFmpegLoading = false;

        const videoEl = document.getElementById('preview');
        const status = document.getElementById('status');
        const btnUpload = document.getElementById('btnUpload');

        // 1. Cargar FFmpeg una sola vez
        async function loadFFmpeg() {
            if (ffmpeg) return;
            try {
                isFFmpegLoading = true;
                status.innerText = "Cargando motor de video...";
                ffmpeg = FFmpeg.createFFmpeg({ log: false });
                await ffmpeg.load();
                status.innerText = "Motor listo.";
                btnUpload.disabled = false;
                btnUpload.innerText = "COMPRIMIR Y SUBIR";
            } catch (e) {
                status.innerText = "Error FFmpeg: Use HTTPS o Localhost";
                console.error(e);
            } finally {
                isFFmpegLoading = false;
            }
        }

        // 2. Iniciar Cámara
        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());

            try {
                const constraints = {
                    video: { facingMode: useFrontCamera ? "user" : "environment" },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = currentStream;
                status.innerText = "Cámara lista";

                // Intentar cargar FFmpeg si no se ha hecho
                loadFFmpeg();
            } catch (e) {
                status.innerText = "Error Cámara: " + e.message;
            }
        }

        document.getElementById('btnSwitch').onclick = () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        };

        document.getElementById('btnSnap').onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            canvas.getContext('2d').drawImage(videoEl, 0, 0);
            canvas.toBlob(blob => {
                capturedBlob = blob;
                showUpload('Foto lista (JPG)');
            }, 'image/jpeg', 0.8);
        };

        document.getElementById('btnRecord').onclick = () => {
            if (mediaRecorder?.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('btnRecord').innerText = "🎥 GRABAR VIDEO";
                document.getElementById('btnRecord').style.background = "#ef4444";
            } else {
                chunks = [];
                mediaRecorder = new MediaRecorder(currentStream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    capturedBlob = new Blob(chunks, { type: 'video/webm' });
                    showUpload('Video listo');
                };
                mediaRecorder.start();
                document.getElementById('btnRecord').innerText = "⏹️ PARAR";
                document.getElementById('btnRecord').style.background = "#334155";
            }
        };

        function showUpload(msg) {
            document.getElementById('infoPreview').innerText = msg;
            document.getElementById('uploadSection').style.display = 'block';
        }

        btnUpload.onclick = async () => {
            if (!ffmpeg || isFFmpegLoading) {
                alert("El compresor aún se está preparando.");
                return;
            }

            btnUpload.disabled = true;
            status.innerText = "Procesando...";

            try {
                let finalFile = capturedBlob;
                const isVideo = capturedBlob.type.includes('video');
                const ext = isVideo ? 'mp4' : 'jpg';
                const fileName = `media_${Date.now()}.${ext}`;

                if (isVideo) {
                    status.innerText = "Comprimiendo video (esto puede tardar)...";
                    ffmpeg.FS('writeFile', 'temp.webm', await FFmpeg.fetchFile(capturedBlob));
                    // Preset 'ultrafast' para evitar tiempos de espera largos en el navegador
                    await ffmpeg.run('-i', 'temp.webm', '-vcodec', 'libx264', '-crf', '28', '-preset', 'ultrafast', 'out.mp4');
                    const data = ffmpeg.FS('readFile', 'out.mp4');
                    finalFile = new File([data.buffer], fileName, { type: 'video/mp4' });
                }

                status.innerText = "Subiendo a Supabase...";
                const { error } = await supabaseClient.storage.from(CONF.BUCKET).upload(fileName, finalFile);

                if (error) throw error;
                status.innerText = "¡Subido con éxito!";
                alert("Guardado correctamente.");
                document.getElementById('uploadSection').style.display = 'none';
            } catch (err) {
                status.innerText = "Error: " + err.message;
            } finally {
                btnUpload.disabled = false;
            }
        };

        initCamera();
    </script>
</body>

</html>
